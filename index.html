<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binx Language Interpreter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #app { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        .binx-btn { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Binx Runtime Environment</h1>
    <div id="app"></div>

    <script>
        // Store Variables and Data
        const binxState = {
            vars: {},
            bedcData: {}
        };

        // 1. Load BEDC File (Binx Extended Data Collection)
        async function loadBEDC(filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Failed to load ${filePath}`);
                const text = await response.text();
                
                // Simple parser for BEDC key=value entries
                text.split('\n').forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed && !trimmed.startsWith('#')) {
                        const [key, val] = trimmed.split('=');
                        if (key && val) binxState.bedcData[key.trim()] = val.trim().replace(/^"|"$/g, '');
                    }
                });
            } catch (err) {
                console.warn('BEDC Notice:', err.message);
            }
        }

        // 2. Load and Execute .binx Script
        async function runBinx(filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Failed to load ${filePath}`);
                const code = await response.text();
                parseAndExecuteBinx(code);
            } catch (err) {
                console.error('Binx Execution Error:', err.message);
            }
        }

        // 3. Parse Binx Syntax Rules
        function parseAndExecuteBinx(code) {
            const lines = code.split('\n');
            let skipBlock = false;

            lines.forEach(line => {
                let trimmed = line.trim();
                
                // Skip empty lines or copyright/header descriptions
                if (!trimmed || trimmed.startsWith('Copyright') || trimmed.startsWith('====') || trimmed.startsWith('.')) {
                    return;
                }

                // Variable Creation: [NewVarName]="hi"
                const varMatch = trimmed.match(/^\[([a-zA-Z0-9_]+)\]="([^"]*)"$/);
                if (varMatch) {
                    const [, name, val] = varMatch;
                    binxState.vars[name] = val;
                    return;
                }

                // Variable Setting: [SetVar]="hi"-[To]-[Hello]
                if (trimmed.includes('[SetVar]') && trimmed.includes('-[To]-')) {
                    const parts = trimmed.split('-[To]-');
                    const targetVar = parts[0].replace('[SetVar]="', '').replace('"', '');
                    const newValue = parts[1].replace(/^\[\vert{}\]$/g, '');
                    
                    if (binxState.vars[targetVar] !== undefined) {
                        binxState.vars[targetVar] = newValue;
                    }
                    return;
                }

                // Conditional Evaluation: [if][Var]="Hello"
                const ifMatch = trimmed.match(/^\[if\]\[([a-zA-Z0-9_]+)\]="([^"]*)"$/);
                if (ifMatch) {
                    const [, varName, targetVal] = ifMatch;
                    skipBlock = binxState.vars[varName] !== targetVal;
                    return;
                }

                // DoThings Action Execution: [MakeA]="Button"
                const makeMatch = trimmed.match(/^\[MakeA\]="([^"]*)"$/);
                if (makeMatch) {
                    if (!skipBlock) {
                        const elementType = makeMatch[1];
                        renderComponent(elementType);
                    }
                    skipBlock = false; // Reset conditional flag
                }
            });
        }

        // 4. Component Rendering Engine
        function renderComponent(type) {
            const app = document.getElementById('app');
            if (type === "Button") {
                const btn = document.createElement('button');
                btn.className = 'binx-btn';
                // Pull label value from BEDC data if present, otherwise fallback to current variable state
                btn.innerText = binxState.bedcData['ButtonLabel'] || binxState.vars['Var'] || 'Binx Button';
                app.appendChild(btn);
            }
        }

        // Auto-run on page load
        window.addEventListener('DOMContentLoaded', async () => {
            await loadBEDC('data.BEDC');
            await runBinx('script.binx');
        });
    </script>
</body>
</html>
