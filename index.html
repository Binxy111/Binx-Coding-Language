<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binx Language Interpreter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #app { margin-top: 20px; padding: 15px; border: 1px solid #ccc; min-height: 50px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
        .binx-btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .binx-input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 200px; }
        .binx-label { font-size: 16px; font-weight: bold; color: #333; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Binx Runtime Environment</h1>
    <div id="app">Loading files...</div>

    <script>
        const binxState = {
            vars: {},
            bedcData: {}
        };

        async function loadFile(filename) {
            const res = await fetch(`./${filename}`);
            if (!res.ok) throw new Error(`Could not load ${filename} (Status: ${res.status})`);
            return await res.text();
        }

        function parseBEDC(text) {
            text.split('\n').forEach(line => {
                const trimmed = line.trim();
                if (trimmed && !trimmed.startsWith('#')) {
                    const [key, val] = trimmed.split('=');
                    if (key && val) binxState.bedcData[key.trim()] = val.trim().replace(/^"|"$/g, '');
                }
            });
        }

        function parseAndExecuteBinx(code) {
            const lines = code.split('\n');
            let skipBlock = false;

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('Copyright') || trimmed.startsWith('====') || trimmed.startsWith('.')) return;

                // Variable Assignment: [NewVarName]="hi"
                const varMatch = trimmed.match(/^\[([a-zA-Z0-9_]+)\]="([^"]*)"$/);
                if (varMatch) {
                    binxState.vars[varMatch[1]] = varMatch[2];
                    return;
                }

                // Variable Setting: [SetVar]="hi"-[To]-[Hello]
                if (trimmed.includes('[SetVar]') && trimmed.includes('-[To]-')) {
                    const parts = trimmed.split('-[To]-');
                    const targetVar = parts[0].replace('[SetVar]="', '').replace('"', '');
                    const newValue = parts[1].replace(/^\[\vert{}\]$/g, '');
                    binxState.vars[targetVar] = newValue;
                    return;
                }

                // Conditionals: [if][Var]="Hello"
                const ifMatch = trimmed.match(/^\[if\]\[([a-zA-Z0-9_]+)\]="([^"]*)"$/);
                if (ifMatch) {
                    skipBlock = binxState.vars[ifMatch[1]] !== ifMatch[2];
                    return;
                }

                // UI Rendering: [MakeA]="Button", [MakeA]="Label", [MakeA]="TextInput"
                const makeMatch = trimmed.match(/^\[MakeA\]="([^"]*)"$/);
                if (makeMatch) {
                    if (!skipBlock) {
                        renderComponent(makeMatch[1]);
                    }
                    skipBlock = false;
                }
            });
        }

        function renderComponent(type) {
            const app = document.getElementById('app');

            if (type === "Button") {
                const btn = document.createElement('button');
                btn.className = 'binx-btn';
                btn.innerText = binxState.bedcData['ButtonLabel'] || binxState.vars['Var'] || 'Binx Button';
                app.appendChild(btn);
            } 
            else if (type === "Label") {
                const label = document.createElement('span');
                label.className = 'binx-label';
                // Pulls text from BEDC 'LabelText' or fallback to Binx 'Var' variable
                label.innerText = binxState.bedcData['LabelText'] || binxState.vars['Var'] || 'Default Label';
                app.appendChild(label);
            } 
            else if (type === "TextInput") {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'binx-input';
                input.placeholder = binxState.bedcData['InputPlaceholder'] || 'Enter text...';
                // Optional initial value assignment
                if (binxState.vars['Var']) {
                    input.value = binxState.vars['Var'];
                }
                app.appendChild(input);
            }
        }

        async function init() {
            const app = document.getElementById('app');
            try {
                try {
                    const bedcText = await loadFile('data.BEDC');
                    parseBEDC(bedcText);
                } catch (e) {
                    console.warn('BEDC file optional or failed to load:', e.message);
                }

                const binxText = await loadFile('script.binx');
                app.innerHTML = '';
                parseAndExecuteBinx(binxText);
            } catch (err) {
                app.innerHTML = `<span class="error">Error: ${err.message}</span>`;
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
